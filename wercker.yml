box: node:22
build:
  steps:
    - script:
      name: Install dependencies
      code: |
        npm ci

    - script:
      name: Build
      code: |
        npm run build

release:
  steps:
    - script:
      name: Install dependencies
      code: |
        npm ci

    - script:
      name: Release
      code: |
        npm run package
        npx semantic-release@24.2.9
